# Production-like local stack: PostgreSQL + API + nginx-served SPA.
#   make up            → http://localhost:8080  (API docs: http://localhost:8100/docs)
name: furniro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: furniro
      POSTGRES_PASSWORD: furniro
      POSTGRES_DB: furniro
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furniro"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DATABASE_URL: postgresql+psycopg://furniro:furniro@db:5432/furniro
      JWT_SECRET: ${JWT_SECRET:-compose-local-secret-change-me-before-prod}
      CORS_ORIGINS: http://localhost:8080
      SEED_ON_STARTUP: "true"
    ports:
      - "8100:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
